# https://github.com/wimpysworld/nix-config/blob/main/.github/workflows/flake-checker.yml
name: Flake ❄️ Checker ✅

on:
  push:
    branches:
      - main
  # Without this every PR merged unverified unless someone remembered to
  # dispatch the workflow by hand.
  pull_request:
  schedule:
    # l33t o'clock
    - cron: '37 13 * * *'
  workflow_dispatch:

jobs:
  # Plugins fail silently: a typo'd name is written to settings.json, Claude
  # Code installs nothing, and no error is ever surfaced. Cheap to check, so it
  # runs first and on ubuntu.
  verify-plugins:
    name: Verify Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify declared plugins resolve
        run: ./scripts/verify-plugins.sh --quiet

  # Dangling references fail the same way: the name is silently ignored, so a
  # deleted skill or a renamed script keeps being "used" by something.
  verify-references:
    name: Verify References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Verify no dangling references
        run: ./scripts/verify-references.sh --quiet

  flake-checker:
    name: Flake Checker
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/flake-checker-action@v13

  build-configs:
    name: Build Darwin Configs
    needs: flake-checker
    runs-on: macos-26
    strategy:
      matrix:
        config: [macbook, work]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Build ${{ matrix.config }}
        run: nix --extra-experimental-features 'nix-command flakes' build ".#darwinConfigurations.${{ matrix.config }}.system"