# https://github.com/wimpysworld/nix-config/blob/main/.github/workflows/flake-checker.yml
name: Flake ❄️ Checker ✅

permissions:
  contents: read

on:
  push:
    branches:
      - main
  # Without this every PR merged unverified unless someone remembered to
  # dispatch the workflow by hand.
  pull_request:
  schedule:
    # l33t o'clock
    - cron: '37 13 * * *'
  workflow_dispatch:

jobs:
  # Plugins fail silently: a typo'd name is written to settings.json, Claude
  # Code installs nothing, and no error is ever surfaced. Cheap to check, so it
  # runs first and on ubuntu.
  verify-plugins:
    name: Verify Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify declared plugins resolve
        run: ./scripts/verify-plugins.sh --quiet

  # alejandra drift breaks `nix fmt --check` and leaks reformatting into diffs.
  # Cheap, so it runs on ubuntu alongside the other fast checks.
  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Check Nix formatting
        run: nix --extra-experimental-features 'nix-command flakes' fmt -- --check .

  # Only reads flake.lock, so no macOS runner needed.
  flake-checker:
    name: Flake Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13

  build-configs:
    name: Build Darwin Configs
    needs: flake-checker
    runs-on: macos-26
    strategy:
      matrix:
        config: [macbook, work]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Build ${{ matrix.config }}
        run: nix --extra-experimental-features 'nix-command flakes' build ".#darwinConfigurations.${{ matrix.config }}.system"
